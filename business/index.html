<style>
:root{--bg:#f4ede6;--surface:#fffaf4;--sunk:#efe5da;--ink:#2a1d16;--muted:#76645a;--line:#e2d4c7;--crema:#b8732a;--crema-soft:#f1dfc6;--on-crema:#fff8ef;--good:#3d7a4c;--warn:#a87a06;--bad:#c4472b;
--display:"Fraunces",Georgia,serif;--body:"Work Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110d;--surface:#211812;--sunk:#1a130e;--ink:#f2e6db;--muted:#ab968a;--line:#3a2c23;--crema:#e09a4a;--crema-soft:#3a2716;--on-crema:#1d120b;--good:#6cb67e;--warn:#e8bd3a;--bad:#ef7a5c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110d;--surface:#211812;--sunk:#1a130e;--ink:#f2e6db;--muted:#ab968a;--line:#3a2c23;--crema:#e09a4a;--crema-soft:#3a2716;--on-crema:#1d120b;--good:#6cb67e;--warn:#e8bd3a;--bad:#ef7a5c;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:700 21px/1.2 var(--display);margin:0;text-wrap:balance}h2{font:700 22px/1.25 var(--display);margin:0 0 6px;text-wrap:balance}h3{font:600 17px/1.3 var(--body);margin:0 0 6px}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
a{color:var(--crema)}
.hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:transparent;color:var(--muted);border:0;padding:8px 10px;border-radius:9px;font:600 15px var(--body);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(40,20,10,.15)}
.lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:5px 12px;font:600 13px var(--body);cursor:pointer;min-height:34px}
.menu{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}
.menu button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font:500 14px var(--body);cursor:pointer;min-height:38px}
.menu button[aria-current="true"]{background:var(--crema);border-color:var(--crema);color:var(--on-crema)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:90px;resize:vertical}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button.btn{background:var(--crema);color:var(--on-crema);border:0;border-radius:12px;padding:10px 16px;font:600 15px var(--body);cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:var(--crema);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font:600 14px var(--body);cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--crema);outline-offset:2px}
.out{margin-top:12px;padding:12px;border-radius:12px;background:var(--crema-soft)}
.big{font:700 26px/1.2 var(--mono)}
.ok{color:var(--good)}.warnT{color:var(--warn)}.badT{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}
.tableWrap{overflow-x:auto}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);margin:2px 4px 2px 0}
.tag.on{background:var(--crema-soft);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);text-align:left;color:var(--ink);font:inherit}
.card summary{cursor:pointer}.card b{display:block}.card small{color:var(--muted)}
.dcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media (min-width:560px){.dcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.dcard .art{background:var(--crema-soft);aspect-ratio:16/10;display:grid;place-items:center;width:100%}
.dcard .art svg{width:100%;height:100%}
.dcard .txt{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.dcard h3{font-size:15px;margin:0}.dcard .meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.dcard.add{border-style:dashed;place-items:center;justify-content:center;align-items:center;min-height:150px;color:var(--crema);font-weight:600;background:transparent}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px}
.check .who{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--crema);padding-left:10px;margin:10px 0}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good)}
dialog{border:0;border-radius:20px;padding:0;max-width:560px;width:calc(100% - 24px);max-height:calc(100% - 24px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(20,10,5,.5)}
.dlgArt{background:var(--crema-soft);height:170px;display:grid;place-items:center}.dlgArt svg{height:100%;width:100%}
.dlgBody{padding:16px;display:flex;flex-direction:column;gap:10px}
.dlgBody ul,.dlgBody ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}.stats div{background:var(--sunk);border-radius:10px;padding:8px}.stats b{display:block;font:600 16px var(--mono)}.stats span{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:14px;height:14px;border-radius:99px;border:1px solid var(--line);flex:none}
.layerRow{display:grid;grid-template-columns:1fr 1fr 80px;gap:6px}
.x{position:absolute;right:10px;top:10px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;width:38px;height:38px;cursor:pointer;font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<header><div class="wrap">
  <div class="top"><h1>Café Lab <span style="color:var(--crema)">Business</span></h1><div class="row" style="gap:8px;flex-wrap:nowrap"><button type="button" class="lang" id="langBtn" aria-label="Language">NL</button><a href="../" id="persLink" style="font-size:13px;white-space:nowrap">Café Lab →</a></div></div>

</div></header>
<main class="wrap" id="view"></main>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>isFinite(n)?(+n).toFixed(d).replace(".",S.lang==="nl"?",":"."):"–";
const eur=n=>isFinite(n)?"€"+fmt(n,2):"–";
const num=v=>parseFloat(String(v??"").replace(",","."));

/* ---------- storage (this device only until café accounts sync) ---------- */
const KEY="cafeWork";
const DEF={role:"boss",section:null,pin:"",machine:"lm-linea-pb",grinder:"mk-e65s",cafe:"",staff:[],signoff:{},menu:null,clean:{},costs:{},plan:{},lang:null};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){S={...DEF}}
if(!S.lang)S.lang=/^nl/i.test(navigator.language||"")?"nl":"en";
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// T(english, dutch); L() reads a value that may be {en,nl} or plain text the owner typed
const T=(en,nl)=>S.lang==="nl"?nl:en;
const L=x=>x&&typeof x==="object"&&!Array.isArray(x)?(x[S.lang]??x.en):x;
const B=(en,nl)=>({en,nl});

/* ---------- commercial equipment ---------- */
const FUNCS={
 vol:[B("Volumetric dosing","Volumetrische dosering"),B("Programmed buttons stop the shot after a set amount of water (counted by a flowmeter). Set them once for the house recipe; check yield on a scale daily because grind and beans change it.","Geprogrammeerde knoppen stoppen de shot na een vaste hoeveelheid water (gemeten met een flowmeter). Stel ze één keer in op het huisrecept; controleer de opbrengst dagelijks op een weegschaal, want maling en bonen veranderen die."),B("Hold the programming button, start the shot with the button you want, stop it at the right yield, release. The machine remembers the pulse count.","Houd de programmeerknop ingedrukt, start de shot met de gewenste knop, stop bij de juiste opbrengst en laat los. De machine onthoudt de hoeveelheid.")],
 manual:[B("Manual / continuous button","Handmatige / doorloopknop"),B("Starts and stops the shot by hand. Use it when dialling in with a scale, and for purging the group.","Start en stopt de shot met de hand. Gebruik hem bij het afstellen met een weegschaal en om de groep door te spoelen."),B("Press once to start, again to stop at your target weight.","Druk één keer om te starten en nog eens om te stoppen op je doelgewicht.")],
 pid:[B("PID temperature control","PID-temperatuurregeling"),B("Electronic control keeps brew water within about ±0.5 °C. Light roasts like it hotter (93–95 °C), dark roasts cooler (88–91 °C).","Elektronische regeling houdt het zetwater binnen ongeveer ±0,5 °C. Lichte brandingen willen het warmer (93–95 °C), donkere koeler (88–91 °C)."),B("Change temperature in the service menu or display; wait 10 minutes after a change before judging taste.","Pas de temperatuur aan in het menu of op het display; wacht 10 minuten na een wijziging voordat je proeft.")],
 multi:[B("Independent group boilers","Aparte boilers per groep"),B("Each group has its own boiler, so two groups can brew at different temperatures (e.g. house blend and a guest single origin).","Elke groep heeft een eigen boiler, dus twee groepen kunnen op verschillende temperaturen zetten (bijv. huisblend en een gast-single origin)."),B("Label each group with the bean it is set for.","Zet bij elke groep welke boon erop is ingesteld.")],
 pre:[B("Pre-infusion","Pre-infusie"),B("Wets the puck at low pressure before full pressure. Fewer channels, more even extraction, especially with fine light roasts.","Maakt de koek eerst nat met lage druk voordat de volle druk komt. Minder kanalen en een gelijkmatigere extractie, vooral bij fijne lichte brandingen."),B("Set the pre-infusion time (usually 2–8 s). Longer pre-infusion = slightly longer total shot time.","Stel de pre-infusietijd in (meestal 2–8 s). Langere pre-infusie = iets langere totale shottijd.")],
 profile:[B("Pressure / flow profiling","Druk- / flowprofilering"),B("The barista or a stored program changes pressure or flow during the shot (e.g. soft start, 9 bar, taper to 6 bar).","De barista of een opgeslagen programma verandert de druk of flow tijdens de shot (bijv. zachte start, 9 bar, aflopend naar 6 bar)."),B("Start with the factory flat 9 bar profile; change one stage at a time and compare taste.","Begin met het vlakke fabrieksprofiel van 9 bar; verander één fase tegelijk en vergelijk de smaak.")],
 grav:[B("Gravimetric (scales in the drip tray)","Gravimetrisch (weegschaal in de lekbak)"),B("Scales under the cup stop the shot at a target weight in grams instead of a water volume. Most consistent yield.","Een weegschaal onder het kopje stopt de shot op een doelgewicht in grammen in plaats van een watervolume. De meest constante opbrengst."),B("Tare happens automatically; keep the drip tray clean and dry or weights drift.","Tarreren gaat automatisch; houd de lekbak schoon en droog, anders verlopen de gewichten.")],
 timer:[B("Shot timer display","Shottimer op het display"),B("Shows the extraction time per group. Shot time is your fastest signal of grind drift.","Toont de extractietijd per groep. De shottijd is je snelste signaal dat de maling verloopt."),B("Note the time with each check shot; aim for the house window, usually 25–32 s.","Noteer de tijd bij elke controleshot; mik op het huisvenster, meestal 25–32 s.")],
 autosteam:[B("Automatic milk steaming","Automatisch melk opschuimen"),B("A temperature probe in the wand stops steaming at a set temperature; some machines also set the foam amount.","Een temperatuursensor in de stoompijp stopt bij een ingestelde temperatuur; sommige machines regelen ook de hoeveelheid schuim."),B("Set stop temperature 55–65 °C; still purge and wipe the wand after every jug.","Stel de stoptemperatuur in op 55–65 °C; blaas de stoompijp na elke kan toch door en veeg hem af.")],
 cool:[B("Cool-touch steam wands","Cool-touch stoompijpen"),B("Insulated wands stay cool so milk does not bake on. Faster cleaning, fewer burns.","Geïsoleerde stoompijpen blijven koel, dus melk brandt niet vast. Sneller schoon, minder brandwonden."),B("Still purge before and after, and wipe with a dedicated damp cloth.","Blaas toch voor en na door en veeg af met een aparte vochtige doek.")],
 water:[B("Hot water tap with mix","Heetwaterkraan met menging"),B("Delivers water for Americanos and tea; a mixing valve sets the temperature so it doesn't spit or scald.","Geeft water voor americano's en thee; een mengventiel regelt de temperatuur zodat het niet spat of verbrandt."),B("Use it for Americanos and tea; never to rinse portafilters with detergent in them.","Gebruik hem voor americano's en thee; nooit om pistons met schoonmaakmiddel erin te spoelen.")],
 eco:[B("Eco / standby mode","Eco- / standbystand"),B("Lowers boiler temperatures or switches off groups during quiet hours to save energy.","Verlaagt de boilertemperatuur of schakelt groepen uit in rustige uren om energie te besparen."),B("Program it to wake 30 minutes before opening.","Programmeer hem zo dat hij 30 minuten voor opening opwarmt.")],
 clean:[B("Automatic cleaning cycle","Automatisch reinigingsprogramma"),B("Runs the backflush program with a blind basket and detergent at the press of a button.","Draait het terugspoelprogramma met een blindfilter en reinigingsmiddel met één druk op de knop."),B("Daily at closing: blind basket + 1 tablet/scoop of detergent per group, run the cycle, then a rinse cycle without detergent.","Dagelijks bij sluiting: blindfilter + 1 tablet/schepje reiniger per groep, programma draaien, daarna spoelen zonder reiniger.")],
 connect:[B("Telemetry / connectivity","Telemetrie / verbinding"),B("Sends shot counts, errors and maintenance alerts to an app or the technician.","Stuurt aantallen shots, storingen en onderhoudsmeldingen naar een app of de monteur."),B("Owners can see shot counts per group and when filters or gaskets are due.","Eigenaren zien het aantal shots per groep en wanneer filters of rubbers aan de beurt zijn.")],
 bar:[B("Pump pressure & boiler gauges","Pomp- en boilermanometers"),B("Show brew pressure (about 9 bar while brewing) and steam boiler pressure (usually 1–1.5 bar).","Tonen de zetdruk (ongeveer 9 bar tijdens het zetten) en de stoomboilerdruk (meestal 1–1,5 bar)."),B("If brew pressure drops or steam pressure is low, call the technician; don't adjust the pump yourself.","Zakt de zetdruk of is de stoomdruk laag, bel dan de monteur; stel de pomp niet zelf bij.")],
 warmer:[B("Cup warmer","Kopjeswarmer"),B("Keeps cups warm so the espresso doesn't lose heat and crema when it hits the cup.","Houdt kopjes warm zodat de espresso geen warmte en crema verliest in het kopje."),B("Store only clean, dry cups upside-down on the warmer.","Zet alleen schone, droge kopjes ondersteboven op de warmer.")],
 bean:[B("Built-in grinder and milk system (super-automatic)","Ingebouwde molen en melksysteem (volautomaat)"),B("Grinds, tamps, brews and textures milk by itself at the press of a drink button. The barista's job becomes setup, cleaning and quality checks.","Maalt, tampt, zet en schuimt melk zelf met één druk op een drankknop. De barista zorgt voor instellen, schoonmaken en kwaliteitscontrole."),B("Run the daily milk-system and brew-unit clean; check one espresso on a scale every morning.","Draai dagelijks de reiniging van melksysteem en zetgroep; weeg elke ochtend één espresso na.")]
};
const TYPES={trad:B("Traditional","Traditioneel"),multi:B("Multi-boiler","Multiboiler"),dual:B("Dual boiler","Dubbele boiler"),hx:B("Heat exchanger","Warmtewisselaar"),super:B("Super-automatic","Volautomaat"),prof:B("pressure/flow profiling","druk-/flowprofilering"),grav:B("gravimetric","gravimetrisch")};
const M=(id,name,brand,type,groups,feat,en,nl)=>({id,name,brand,type,groups,feat,note:B(en,nl)});
const MACHINES=[
 M("lm-linea-pb","Linea PB","La Marzocco",["multi"],"2–4",["vol","manual","pid","pre","timer","water","eco","bar","warmer","clean"],"The café workhorse. Saturated groups with dual boilers; very stable temperature.","Het werkpaard van veel cafés. Verzadigde groepen met dubbele boiler; zeer stabiele temperatuur."),
 M("lm-linea-classic","Linea Classic S","La Marzocco",["dual"],"2–4",["vol","manual","pid","water","bar","warmer"],"Simple, robust update of the original Linea.","Eenvoudige, robuuste versie van de originele Linea."),
 M("lm-gb5","GB5 S","La Marzocco",["dual"],"2–4",["vol","manual","pid","pre","timer","water","eco","bar","warmer","clean"],"Linea internals with a different body and a display per group.","Linea-techniek in een andere behuizing, met een display per groep."),
 M("lm-kb90","KB90","La Marzocco",["dual"],"2–4",["vol","manual","pid","pre","timer","water","eco","bar","warmer","clean","cool"],"Straight-in portafilter and automatic flush between shots; built for high volume.","Piston recht erin en automatisch spoelen tussen shots; gebouwd voor grote aantallen."),
 M("lm-strada","Strada X","La Marzocco",["multi","prof"],"2–3",["vol","manual","pid","multi","pre","profile","timer","water","bar","warmer","clean"],"Paddle or programmed flow profiling per group.","Flowprofilering per groep met een hendel of een programma."),
 M("va-eagle-one","Eagle One","Victoria Arduino",["multi"],"2–3",["vol","manual","pid","multi","pre","timer","water","eco","warmer","clean","cool"],"Low-energy design (NEO system); compact and low.","Energiezuinig ontwerp (NEO-systeem); compact en laag."),
 M("va-black-eagle","Black Eagle Maverick","Victoria Arduino",["multi","grav"],"2–3",["vol","manual","pid","multi","pre","grav","timer","water","autosteam","eco","warmer","clean","cool","connect"],"Gravitech scales stop shots by weight. A competition favourite.","Gravitech-weegschalen stoppen de shot op gewicht. Favoriet op wedstrijden."),
 M("ns-aurelia-wave","Aurelia Wave","Nuova Simonelli",["hx"],"2–3",["vol","manual","pid","pre","timer","water","autosteam","eco","bar","warmer","clean","cool"],"Soft infusion and optional Easy Cream automatic milk; easy for new staff.","Zachte infusie en optioneel Easy Cream automatische melk; makkelijk voor nieuw personeel."),
 M("ns-appia-life","Appia Life","Nuova Simonelli",["hx"],"1–3",["vol","manual","pre","water","eco","bar","warmer"],"Affordable and very common in small cafés.","Betaalbaar en heel gewoon in kleine cafés."),
 M("slayer-steam","Steam LP","Slayer",["multi","prof"],"1–3",["vol","manual","pid","multi","pre","profile","timer","water","cool","eco","warmer"],"Needle-valve flow control for a long, low-flow pre-brew.","Naaldventiel voor flowcontrole en een lange voorzetfase met lage flow."),
 M("synesso-hydra","MVP Hydra","Synesso",["multi","prof"],"2–4",["vol","manual","pid","multi","pre","profile","timer","water","bar","warmer"],"Programmable pressure profiles per group; very temperature stable.","Programmeerbare drukprofielen per groep; zeer temperatuurstabiel."),
 M("kvdw-spirit","Spirit","Kees van der Westen",["multi","prof"],"2–3",["manual","pid","multi","pre","profile","timer","water","bar","warmer"],"Dutch-made; a paddle sets the pressure through the shot.","Nederlands gemaakt; met een hendel stuur je de druk tijdens de shot."),
 M("sr-cafe-racer","Café Racer","Sanremo",["multi"],"2–4",["vol","manual","pid","multi","pre","timer","water","eco","bar","warmer","clean"],"Distinctive open-frame design with independent group temperatures.","Opvallend open ontwerp met aparte temperatuur per groep."),
 M("sr-opera","Opera 2.0","Sanremo",["multi","prof"],"2–3",["vol","manual","pid","multi","pre","profile","timer","water","eco","bar","warmer","clean"],"Variable-pressure profiles stored per button.","Variabele drukprofielen per knop opgeslagen."),

  $("#view").onchange=e=>{const c=e.target.dataset.c;if(c){S.clean[c]=e.target.checked;save();VIEWS.routine()}};
 }else{
  V(head+`<p class="hint">${T("Change any task, add your own, remove what you don't do, or start a new list (e.g. “Milk fridge” or “Saturday deep clean”). Changes save straight away.","Pas elke taak aan, voeg je eigen taken toe, haal weg wat je niet doet, of begin een nieuwe lijst (bijv. ‘Melkkoelkast’ of ‘Grote schoonmaak zaterdag’). Wijzigingen worden meteen bewaard.")}</p>`+
  S.routines.map((sec,si)=>`<div class="panel" style="display:flex;flex-direction:column;gap:8px">
   <div class="row" style="flex-wrap:nowrap"><input id="sn_${sec.id}" data-sname="${si}" value="${esc(L(sec.name))}" aria-label="${T("List name","Naam lijst")}" style="font-weight:600"></div>
   <div class="row" style="gap:6px"><button type="button" class="ghost" data-up="${si}"${si?"":" disabled"} aria-label="${T("Move up","Omhoog")}">↑</button><button type="button" class="ghost" data-down="${si}"${si<S.routines.length-1?"":" disabled"} aria-label="${T("Move down","Omlaag")}">↓</button><button type="button" class="ghost" data-delsec="${si}">${T("Delete list","Lijst verwijderen")}</button></div>
   ${sec.items.map((it,ii)=>`<div class="row" style="flex-wrap:nowrap;gap:6px"><textarea id="it_${it.id}" data-item="${si}|${ii}" rows="2" style="min-height:0;resize:none;font-size:15px" aria-label="${T("Task","Taak")}">${esc(L(it.t))}</textarea><button type="button" class="ghost" data-iup="${si}|${ii}"${ii?"":" disabled"} aria-label="${T("Move up","Omhoog")}" style="padding:8px 10px">↑</button><button type="button" class="ghost" data-idel="${si}|${ii}" aria-label="${T("Remove task","Taak verwijderen")}" style="padding:8px 12px">✕</button></div>`).join("")}
   <div class="row" style="flex-wrap:nowrap;gap:6px"><input id="new_${sec.id}" data-new="${si}" placeholder="${T("New task, e.g. Clean the milk fridge","Nieuwe taak, bijv. Melkkoelkast schoonmaken")}"><button type="button" class="btn" data-add="${si}">${T("Add","Toevoegen")}</button></div></div>`).join("")+
  `<div class="panel"><h3>${T("New list","Nieuwe lijst")}</h3><div class="row" style="flex-wrap:nowrap;gap:6px"><input id="newSec" placeholder="${T("e.g. Saturday deep clean","bijv. Grote schoonmaak zaterdag")}"><button type="button" class="btn" id="addSec">${T("Add list","Lijst toevoegen")}</button></div></div>
  <div class="row"><button type="button" class="ghost" id="rClear">${T("Clear everything and start empty","Alles wissen en leeg beginnen")}</button><button type="button" class="ghost" id="rReset">${T("Back to the standard lists","Terug naar de standaardlijsten")}</button></div>`);
  const v=$("#view"),rr=()=>{save();VIEWS.routine()},ix=s=>s.split("|").map(Number);
  // typing edits text in place; no re-render so the keyboard stays open
  v.oninput=e=>{const a=e.target.dataset;if(a.sname!=null){S.routines[a.sname].name=e.target.value;save()}if(a.item){const[si,ii]=ix(a.item);S.routines[si].items[ii].t=e.target.value;save()}};
  const addItem=si=>{const inp=$(`[data-new="${si}"]`),t=inp.value.trim();if(!t)return;S.routines[si].items.push({id:uid(),t});save();VIEWS.routine();const n=$(`[data-new="${si}"]`);n&&n.focus()};
  v.onkeydown=e=>{if(e.key!=="Enter")return;const a=e.target.dataset;if(a.new!=null)addItem(+a.new);if(e.target.id==="newSec")$("#addSec").click()};
  v.onclick=e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset;
   if(b.id==="rToggle"){e.stopPropagation();rEdit=false;VIEWS.routine();return}
   if(a.add!=null)return addItem(+a.add);
   if(a.idel){const[si,ii]=ix(a.idel);S.routines[si].items.splice(ii,1);return rr()}
   if(a.iup){const[si,ii]=ix(a.iup),l=S.routines[si].items;[l[ii-1],l[ii]]=[l[ii],l[ii-1]];return rr()}
   if(a.up!=null){const i=+a.up,l=S.routines;[l[i-1],l[i]]=[l[i],l[i-1]];return rr()}
   if(a.down!=null){const i=+a.down,l=S.routines;[l[i+1],l[i]]=[l[i],l[i+1]];return rr()}
   if(a.delsec!=null)return twice(b,()=>{S.routines.splice(+a.delsec,1);rr()});
   if(b.id==="addSec"){const t=$("#newSec").value.trim();if(!t)return;S.routines.push({id:uid(),name:t,items:[]});rr();const n=$(`[data-new="${S.routines.length-1}"]`);n&&n.focus();return}
   if(b.id==="rClear")return twice(b,()=>{S.routines=[];rr()});
   if(b.id==="rReset")return twice(b,()=>{S.routines=defRoutines();rr()});
  };
  return;
 }
 const t=$("#rToggle");if(t)t.onclick=e=>{e.stopPropagation();rEdit=true;VIEWS.routine()};
};

VIEWS.machine=()=>{const m=mach();
 V(`<div class="panel"><h2>${esc(m.brand+" "+m.name)}</h2><p class="hint">${mtype(m)} · ${m.groups} ${T("groups","groepen")}. ${esc(L(m.note))}</p>${!S.cafe?`<p class="note">${T("Your manager hasn't set the café's machine yet; this is the default.","Je manager heeft de machine van het café nog niet ingesteld; dit is de standaard.")}</p>`:""}</div>
 <h3>${T("What this machine does, and how to use it","Wat deze machine kan, en hoe je het gebruikt")}</h3>${m.feat.map(f=>`<div class="panel"><h3>${L(FUNCS[f][0])}</h3><p>${L(FUNCS[f][1])}</p><p class="note"><b>${T("How","Hoe")}:</b> ${L(FUNCS[f][2])}</p></div>`).join("")}
 <details class="panel"><summary>${T("Functions this machine doesn't have","Functies die deze machine niet heeft")}</summary>${Object.keys(FUNCS).filter(f=>!m.feat.includes(f)).map(f=>`<p><b>${L(FUNCS[f][0])}</b> — ${L(FUNCS[f][1])}</p>`).join("")}</details>
 <p class="hint">${T("Exact buttons differ per model year. Keep the manufacturer's manual by the machine.","De precieze knoppen verschillen per bouwjaar. Houd de handleiding bij de machine.")}</p>`)};

VIEWS.grinder=()=>{const g=grind(),step=g.adj!=="dial"||true;
 V(`<div class="panel"><h2>${esc(g.brand+" "+g.name)}</h2><p class="hint">${burr(g.burr)} · ${L(ADJ[g.adj])}</p><p>${esc(L(g.note))}</p><div>${g.feat.map(f=>`<span class="tag on">${L(GF[f])}</span>`).join("")}</div></div>
 <div class="panel"><h3>${T("How to adjust","Zo stel je bij")}</h3><ul>
 <li>${T("<b>Shot too fast / sour</b> → grind <b>finer</b>. <b>Too slow / bitter</b> → <b>coarser</b>.","<b>Shot te snel / zuur</b> → <b>fijner</b> malen. <b>Te langzaam / bitter</b> → <b>grover</b>.")}</li>
 <li>${T("Move in small steps; on a stepless grinder a tiny turn is enough.","Draai in kleine stapjes; bij een traploze molen is een heel klein beetje genoeg.")}</li>
 <li>${T("After every change, purge one dose (the old grind is still in the chute) before the next check shot.","Maal na elke wijziging één dosis weg (de oude maling zit nog in de uitloop) voor de volgende controleshot.")}</li>
 <li>${T("Adjust while the motor runs, so beans don't jam between the burrs.","Stel bij terwijl de motor draait, zodat er geen bonen klem raken tussen de schijven.")}</li>
 ${g.feat.includes("gbw")?`<li>${T("Grind by weight: set the dose in grams; check it on a scale weekly.","Malen op gewicht: stel de dosis in grammen in; controleer wekelijks op een weegschaal.")}</li>`:g.feat.includes("time")?`<li>${T("Time dosing: when you go finer, the dose drops. Weigh it and add a little time.","Dosering op tijd: als je fijner gaat, wordt de dosis kleiner. Weeg na en zet er wat tijd bij.")}</li>`:""}</ul></div>
 <div class="panel"><h3>${T("Dose check","Dosiscontrole")}</h3><p class="hint">${T("Weigh three doses in a row. They should be within ±0.2 g of the house dose.","Weeg drie doses achter elkaar. Ze moeten binnen ±0,2 g van de huisdosis zitten.")}</p></div>`)};

VIEWS.gear=()=>{
 V(`<h2>${T("Commercial equipment guide","Gids professionele apparatuur")}</h2><p class="hint">${T("The 25 espresso machines and 15 grinders you meet most in cafés, and what each can do. Tap one for details.","De 25 espressomachines en 15 molens die je het vaakst in cafés ziet, en wat ze kunnen. Tik er een aan voor details.")}</p>
 <input id="gq" type="search" placeholder="${T("Search, e.g. La Marzocco, gravimetric","Zoek, bijv. La Marzocco, gravimetrisch")}" style="margin-bottom:12px">
 <h3>${T("Espresso machines","Espressomachines")} (${MACHINES.length})</h3><div class="cards" id="gm"></div>
 <h3 style="margin-top:16px">${T("Grinders","Molens")} (${GRINDERS.length})</h3><div class="cards" id="gg"></div>
 <div class="panel" style="margin-top:16px"><h3>${T("All machine functions explained","Alle machinefuncties uitgelegd")}</h3>${Object.values(FUNCS).map(f=>`<details><summary>${L(f[0])}</summary><p>${L(f[1])}</p><p class="note">${L(f[2])}</p></details>`).join("")}</div>
 <p class="hint">${T("Features are for typical current versions; options vary by year and configuration. Check with your dealer.","Functies gelden voor gangbare huidige versies; opties verschillen per jaar en uitvoering. Vraag het je dealer.")}</p>`);
 const boss=S.role==="boss";
 const draw=()=>{const q=$("#gq").value.toLowerCase();
   $("#gm").innerHTML=MACHINES.filter(m=>(m.brand+" "+m.name+" "+mtype(m)+" "+m.feat.map(f=>L(FUNCS[f][0])).join(" ")).toLowerCase().includes(q)).map(m=>`<details class="card"><summary><b>${esc(m.brand)} ${esc(m.name)}</b><small>${mtype(m)} · ${m.groups} ${T("groups","groepen")}</small></summary><p style="font-size:14px">${esc(L(m.note))}</p>${m.feat.map(f=>`<span class="tag on">${L(FUNCS[f][0])}</span>`).join("")}${boss?`<p><button class="ghost" type="button" data-usem="${m.id}">${T("Use in my café","Gebruik in mijn café")}</button></p>`:""}</details>`).join("");
   $("#gg").innerHTML=GRINDERS.filter(g=>(g.brand+" "+g.name+" "+g.burr+" "+g.feat.map(f=>L(GF[f])).join(" ")).toLowerCase().includes(q)).map(g=>`<details class="card"><summary><b>${esc(g.brand)} ${esc(g.name)}</b><small>${burr(g.burr)} · ${L(ADJ[g.adj])}</small></summary><p style="font-size:14px">${esc(L(g.note))}</p>${g.feat.map(f=>`<span class="tag on">${L(GF[f])}</span>`).join("")}${boss?`<p><button class="ghost" type="button" data-useg="${g.id}">${T("Use in my café","Gebruik in mijn café")}</button></p>`:""}</details>`).join("")};
 $("#gq").oninput=draw;draw();
 $("#view").onclick=e=>{const a=e.target.dataset;if(a.usem){S.machine=a.usem;save();toast(T("Machine set","Machine ingesteld"))}if(a.useg){S.grinder=a.useg;save();toast(T("Grinder set","Molen ingesteld"))}};
};

go();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
